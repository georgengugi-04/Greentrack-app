name: greentrack
description: GreenTrack - Farm-to-Table Supply Chain Traceability
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  firebase_storage: ^13.4.3

  # Auth (Google Sign-In)
  google_sign_in: ^7.2.0

  # State & Navigation
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0

  # UI
  google_fonts: ^8.1.0
  flutter_animate: ^4.5.0
  qr_flutter: ^4.1.0
  cached_network_image: ^3.3.1

  # Utils
  collection: ^1.18.0
  uuid: ^4.3.3
  intl: ^0.20.3
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
